<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root { --bg: #14082e; --bg2: #2a1060; --ink: #f3eeff; --dim: rgba(243,238,255,.62); --edge: rgba(255,255,255,.16); --glass: rgba(255,255,255,.07); --acc: #9fd0ff; --good: #8dffc1; --bad: #ff8e9c; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px clamp(16px, 3vw, 36px); background: rgba(20,8,46,.82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--edge); }
header h1 { font-size: 17px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
header h1 small { font-weight: 300; color: var(--dim); letter-spacing: .06em; text-transform: none; margin-left: 8px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.tab { border: 1px solid transparent; background: transparent; padding: 7px 16px; border-radius: 99px; color: var(--dim); }
.tab:hover { color: var(--ink); background: var(--glass); }
.tab[aria-selected="true"] { color: var(--ink); background: rgba(159,208,255,.2); border-color: rgba(159,208,255,.5); }
.dirty { font-size: 13px; padding: 3px 12px; border-radius: 99px; border: 1px solid var(--edge); color: var(--dim); white-space: nowrap; }
.dirty.on { color: #ffd98a; border-color: rgba(255,217,138,.6); }
main { max-width: 1100px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 36px) 80px; }
h2 { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
.lead { color: var(--dim); margin-bottom: 20px; max-width: 70ch; }
.card { background: var(--glass); border: 1px solid var(--edge); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
.card h3 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin-bottom: 14px; }
.grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid .wide { grid-column: 1 / -1; }
label.f { display: block; }
label.f > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 5px; }
label.f > small { display: block; font-size: 12.5px; color: var(--dim); margin-top: 4px; }
input[type=text], input[type=url], input[type=number], input[type=month], input[type=password], select, textarea { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(0,0,0,.28); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(159,208,255,.22); }
textarea { resize: vertical; min-height: 84px; }
select option { background: #1b0d3d; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(255,255,255,.1); }
.btn:hover { background: rgba(255,255,255,.18); }
.btn.go { background: linear-gradient(180deg, #7fbcff, #4f86e8); color: #06122a; border-color: transparent; font-weight: 600; }
.btn.go:hover { filter: brightness(1.08); }
.btn.bad { color: var(--bad); border-color: rgba(255,142,156,.4); }
.btn.sm { padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.split { display: grid; gap: 18px; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.glist { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; }
.gi { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; border: 1px solid var(--edge); background: var(--glass); }
.gi:hover { background: rgba(255,255,255,.12); }
.gi[aria-current="true"] { border-color: rgba(159,208,255,.7); background: rgba(159,208,255,.16); }
.gi img, .gi .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: rgba(0,0,0,.3); display: block; }
.gi .ph { display: grid; place-items: center; font-size: 11px; color: var(--dim); }
.gi b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gi small { color: var(--dim); font-size: 12.5px; }
.cover { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.cover .pv { width: 112px; height: 112px; border-radius: 16px; object-fit: cover; border: 1px solid var(--edge); background: rgba(0,0,0,.3); display: grid; place-items: center; color: var(--dim); font-size: 13px; text-align: center; overflow: hidden; }
.cover img.pv { display: block; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: flex; align-items: center; gap: 8px; }
.checks input { width: 18px; height: 18px; accent-color: #7fbcff; }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; gap: 8px; align-items: center; }
.line.c2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; }
.line.log { grid-template-columns: 90px minmax(0, 1fr) auto; }
.line.sup { grid-template-columns: minmax(0, 1.2fr) 120px 120px 150px minmax(0, 1.6fr) auto; }
.line.wip { grid-template-columns: minmax(0, 1.6fr) 90px minmax(0, 1fr) 90px auto; }
@media (max-width: 820px) { .line.sup, .line.wip { grid-template-columns: 1fr 1fr; } .line.sup > :nth-child(5), .line.wip > :nth-child(1) { grid-column: 1 / -1; } }
.x { border: 0; background: transparent; color: var(--dim); font-size: 20px; border-radius: 8px; width: 34px; height: 34px; }
.x:hover { color: var(--bad); background: rgba(255,142,156,.12); }
.note { color: var(--dim); font-size: 14px; }
.warn { border: 1px solid rgba(255,217,138,.5); background: rgba(255,217,138,.08); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin: 12px 0; }
.ok { color: var(--good); } .err { color: var(--bad); }
.log { font: 13px/1.6 var(--mono); background: rgba(0,0,0,.35); border-radius: 12px; padding: 12px 14px; min-height: 64px; max-height: 240px; overflow: auto; white-space: pre-wrap; margin-top: 12px; }
ol.steps { margin: 8px 0 0 20px; color: var(--dim); font-size: 14.5px; } ol.steps li { margin: 4px 0; }
code { font-family: var(--mono); font-size: .9em; background: rgba(0,0,0,.3); padding: 1px 6px; border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #0d0626; border: 1px solid var(--edge); padding: 10px 20px; border-radius: 99px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }
</style>
</head>
<body>

  <h1>Admin<small id="siteName"></small></h1>

<script>

/* ---------- tab Game ---------- */
function coverSrc(g) { return covers[g.id] || (g.cover || "covers/" + g.id + ".jpg"); }

  root.appendChild(el("p", "lead", "Tambah atau ubah game. Game baru muncul paling atas. Setelah selesai, buka tab Publikasi."));
  var wrap = el("div", "split"), list = el("div", "glist"), form = el("div");
  var add = el("button", "btn go", "+ Game baru"); add.type = "button";

    b.appendChild(im); var t = el("div"); t.appendChild(el("b", null, g.name || "(tanpa nama)")); t.appendChild(el("small", null, g.plat + " · v" + g.ver + " · " + g.state)); b.appendChild(t);

  });
  wrap.appendChild(list); wrap.appendChild(form); root.appendChild(wrap);
  if (!DATA.games.length) { form.appendChild(el("p", "note", "Belum ada game. Klik “+ Game baru”.")); return; }
  if (cur >= DATA.games.length) cur = DATA.games.length - 1;

}
function gameForm(root, g) {
  var c1 = el("div", "card"); c1.appendChild(el("h3", null, "Info utama")); var gr = el("div", "grid");
  gr.appendChild(field("Nama game", inp("text", g, "name", { ph: "contoh: Digimon Rumble Arena", live: function (v) {

  } })));

  ss.addEventListener("change", function () { g.state = ss.value; markDirty(); }); gr.appendChild(field("Status rilis", ss));
  gr.appendChild(field("Versi", inp("text", g, "ver", { ph: "1.0" })));

  c1.appendChild(gr); root.appendChild(c1);

  var idIn, fileIn, fileEdited = !!g.file && g.file !== g.id + "-id.xdelta";
  var c2 = el("div", "card"); c2.appendChild(el("h3", null, "Cover")); var cv = el("div", "cover");
  var pv = document.createElement("img"); pv.className = "pv"; pv.alt = "Cover"; pv.src = coverSrc(g); pv.addEventListener("error", function () { var d = el("div", "pv", "Belum ada cover"); pv.replaceWith(d); pv = d; });
  var side = el("div"); var pick = document.createElement("input"); pick.type = "file"; pick.accept = "image/jpeg,image/png,image/webp"; pick.hidden = true;
  var pb = el("button", "btn", "Pilih foto cover…"); pb.type = "button"; pb.addEventListener("click", function () { pick.click(); });
  pick.addEventListener("change", function () {
    var f = pick.files[0]; if (!f) return;
    squareJpg(f, 320, function (err, url) {
      if (err) { toast(err); return; }
      covers[g.id] = url; if (pv.tagName !== "IMG") { var n = document.createElement("img"); n.className = "pv"; n.alt = "Cover"; pv.replaceWith(n); pv = n; } pv.src = url; markDirty(); toast("Cover diganti"); var y = scrollY; render(); scrollTo(0, y);
    });

  side.appendChild(pb); side.appendChild(pick);
  side.appendChild(el("p", "note", "Foto dipotong persegi dan diperkecil otomatis (JPG). Disimpan sebagai covers/" + g.id + ".jpg."));
  cv.appendChild(pv); cv.appendChild(side); c2.appendChild(cv); root.appendChild(c2);

  var c3 = el("div", "card"); c3.appendChild(el("h3", null, "Berkas patch")); var g3 = el("div", "grid");
  fileIn = inp("text", g, "file", { ph: "nama-patch.xdelta", live: function () { fileEdited = true; } });
  g3.appendChild(field("Nama file", fileIn));
  g3.appendChild(field("Ukuran", inp("text", g, "size", { ph: "contoh: 2,4 MB" })));
  g3.appendChild(field("Link unduh", inp("url", g, "url", { ph: "https://…" }), "Link langsung ke file .xdelta (Google Drive, Mediafire, GitHub Releases, dll). Kosong = tombol unduh belum aktif.", true));

  idIn.addEventListener("change", function () { var old = g.id; var nid = uniqueId(slug(idIn.value), g); if (nid !== old) { if (covers[old]) { covers[nid] = covers[old]; delete covers[old]; } g.id = nid; idIn.value = nid; markDirty(); render(); } });
  g3.appendChild(field("ID (alamat halaman)", idIn, "Dipakai untuk link #id dan nama file cover. Biasanya tidak perlu diubah."));

/* editor baris generik: arr = array of arrays */

/* ---------- tab WIP ---------- */

    var ad = el("button", "btn sm", "+ Tambah"); ad.type = "button"; ad.addEventListener("click", function () { DATA.roadmap.push({ name: "", plat: "PS1", status: "Dikerjakan", pct: 0 }); markDirty(); draw(); }); box.appendChild(ad);

/* ---------- tab Pendukung ---------- */
function thisMonth() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

/* ---------- ZIP (tanpa kompresi) ---------- */
var CRC = (function () { var t = [], n, k, c; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  var enc = new TextEncoder(), parts = [], cen = [], off = 0, d = new Date();
  var dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  files.forEach(function (f) {
    var nm = enc.encode(f.name), cr = crc32(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, tm, true); h.setUint16(12, dt, true);
    h.setUint32(14, cr, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, tm, true); c.setUint16(14, dt, true);
    c.setUint32(16, cr, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + f.data.length;

function squareJpg(file, size, cb) {
  if (!/^image\//.test(file.type)) return cb("File bukan gambar");
  var url = URL.createObjectURL(file), im = new Image();
  im.onload = function () {
    var s = Math.min(im.naturalWidth, im.naturalHeight), c = document.createElement("canvas"); c.width = c.height = Math.min(size, s);
    var x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); cb(null, c.toDataURL("image/jpeg", 0.86));
  };
  im.onerror = function () { URL.revokeObjectURL(url); cb("Gambar tidak bisa dibaca"); }; im.src = url;
}

    g.credits = (g.credits || []).filter(function (c) { return String(c[1]).trim(); }); g.log = (g.log || []).filter(function (l) { return String(l[1]).trim(); });
    if (covers[g.id]) g.cover = "covers/" + g.id + ".jpg"; else if (g.cover && /^data:/.test(g.cover)) delete g.cover;
  });
  d.roadmap = d.roadmap.filter(function (w) { return String(w.name).trim(); }); d.supporters = d.supporters.filter(function (s) { return String(s.n).trim(); });
  return d;

function problems() {
  var p = [], seen = {};
  DATA.games.forEach(function (g, i) {
    var n = g.name ? "“" + g.name + "”" : "Game #" + (i + 1);
    if (!String(g.name).trim()) p.push(n + ": nama belum diisi");
    if (seen[g.id]) p.push(n + ": ID kembar"); seen[g.id] = 1;
    if (g.url && !/^https?:\/\//i.test(g.url)) p.push(n + ": link unduh harus diawali http:// atau https://");
  });
  ["trakteer", "saweria"].forEach(function (k) { var u = DATA.donate[k]; if (u && !/^https?:\/\//i.test(u)) p.push("Link " + k + " harus diawali https://"); });
  return p;
}
function filesToPublish() {
  var d = cleanData(), enc = new TextEncoder(), out = [{ name: "data/site.json", data: enc.encode(JSON.stringify(d, null, 2) + "\n") }];
  Object.keys(covers).forEach(function (id) { if (d.games.some(function (g) { return g.id === id; })) out.push({ name: "covers/" + id + ".jpg", data: dataUrlBytes(covers[id]) }); });
  return out;

function bytesToB64(u8) { var s = "", ch = 0x8000; for (var i = 0; i < u8.length; i += ch) s += String.fromCharCode.apply(null, u8.subarray(i, i + ch)); return btoa(s); }

    method: method, headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + cfg.token, "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined

}

function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  d.games = Array.isArray(d.games) ? d.games : []; d.roadmap = Array.isArray(d.roadmap) ? d.roadmap : []; d.supporters = Array.isArray(d.supporters) ? d.supporters : [];

  d.donate.goal = d.donate.goal || { label: "", target: 0, current: 0 }; d.sample = !!d.sample;
  d.games.forEach(function (g) {
    g.credits = g.credits || []; g.log = g.log || []; g.video = g.video || { yt: "", src: "" }; g.compat = g.compat || [];
    g.sprite = g.sprite || "creature"; g.pal = g.pal || PAL; g.plat = PLATS[g.plat] ? g.plat : "PS1"; g.ext = g.ext || PLATS[g.plat].ext;
    g.state = String(g.state).toLowerCase() === "final" ? "Final" : "Beta"; g.url = g.url || ""; g.size = g.size || ""; g.file = g.file || ""; g.desc = g.desc || "";
    g.ver = g.ver || "1.0"; g.progress = Number(g.progress) || 0; g.downloads = Number(g.downloads) || 0;
  });
  return d;
}
var TABS = [["game", "Game"], ["wip", "WIP"], ["sup", "Pendukung"], ["site", "Situs"], ["pub", "Publikasi"]];

  ({ game: renderGames, wip: renderWip, sup: renderSup, site: renderSite, pub: renderPublish })[tab](m);

function start(d, fromDraft) {

  if (fromDraft) { dirty = true; $("dirty").textContent = "Draf dipulihkan, belum dipublikasikan"; $("dirty").classList.add("on"); }
}
function boot() {
  var draft = null; try { draft = JSON.parse(ls("zyfars-admin-draft") || "null"); } catch (e) {}
  fetch("data/site.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {

  }).catch(function () {

  });
}
