<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zyfars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Konsep: menu horizontal-vertikal bergaya konsol genggam: baris kategori melayang, daftar item di bawahnya, latar gelombang sutra yang warnanya mengikuti bulan. Satu tema gelap (pilihan desain). */
:root {
  --bg: #050a18;
  --glass: rgba(255,255,255,.08);
  --glass-2: rgba(255,255,255,.14);
  --edge: rgba(255,255,255,.22);
  --ink: #f2f6ff;
  --dim: rgba(225,236,255,.62);
  --accent: #9fd0ff;
  --good: #8dffc1;
  --warn: #ffd98a;
  --top: #1a4f9c;
  --bot: #06122c;
  --font: "Jost", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font); font-weight: 400; font-size: 17px; line-height: 1.5;
  background: linear-gradient(180deg, var(--top) 0%, var(--bot) 100%);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
  overflow-x: hidden;
}
#wave { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; min-height: calc(100vh - 58px); min-height: calc(100dvh - 58px); display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; border-radius: 10px; }
button { font: inherit; color: inherit; }

/* ---------- bilah atas ---------- */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 300; }
.brand { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.brand b { font-weight: 500; }
.clock { display: flex; gap: 14px; align-items: center; color: var(--dim); font-size: 18px; font-variant-numeric: tabular-nums; }
.clock .t { color: var(--ink); font-size: 26px; font-weight: 300; letter-spacing: .04em; }
.pill { border: 1px solid var(--edge); background: var(--glass); padding: 2px 12px; border-radius: 99px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }

/* ---------- baris kategori ---------- */
.cats-wrap { overflow: hidden; margin-top: 34px; padding: 22px 0 10px; }
.cats { display: flex; gap: 44px; transition: transform .45s cubic-bezier(.2,.8,.2,1); will-change: transform; width: max-content; }
.cat { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 76px; padding: 0; opacity: .6; transition: opacity .3s, transform .45s cubic-bezier(.2,.8,.2,1); }
.cat .tile { width: 70px; height: 70px; border-radius: 20px; border: 1px solid var(--edge); background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.05)); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35); font-weight: 500; font-size: 20px; letter-spacing: .06em; }
.cat svg { width: 32px; height: 32px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cat .lb { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.cat.sel { opacity: 1; transform: scale(1.28); }
.cat.sel .tile { box-shadow: 0 0 34px rgba(159,208,255,.55), 0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.5); }
.cat.sel .lb { opacity: 1; }

/* ---------- isi ---------- */
.main { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 28px; margin-top: 34px; align-items: start; }
.items { display: flex; flex-direction: column; gap: 6px; padding-left: var(--pad, 0px); min-width: 0; }
.item { display: flex; align-items: center; gap: 16px; background: none; border: 0; text-align: left; cursor: pointer; padding: 8px 12px 8px 0; border-radius: 16px; opacity: .55; transition: opacity .25s, background .25s, transform .3s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.item:hover { opacity: .9; }
.item .ic { flex: none; width: 56px; height: 56px; border-radius: 15px; border: 1px solid var(--edge); background: var(--glass); display: grid; place-items: center; overflow: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
.item .ic canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.item .ic img.cov { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .ic svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.item .tx { min-width: 0; }
.item .nm { font-size: 20px; line-height: 1.2; font-weight: 400; overflow-wrap: anywhere; }
.item .sb { font-size: 14px; color: var(--dim); letter-spacing: .04em; }
.item.sel { opacity: 1; }
.item.sel .ic { transform: scale(1.22); box-shadow: 0 0 26px rgba(159,208,255,.6); background: var(--glass-2); margin-right: 6px; }
.item.sel .nm { font-weight: 500; text-shadow: 0 0 14px rgba(159,208,255,.6); }
.item.empty { cursor: default; }

.panel { background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04)); border: 1px solid var(--edge); border-radius: 26px; padding: 26px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 24px 60px rgba(0,0,0,.35); min-width: 0; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.panel h2 { margin: 0; font-weight: 300; font-size: clamp(26px, 4vw, 38px); letter-spacing: .02em; line-height: 1.12; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px; }
.chip { border: 1px solid var(--edge); background: var(--glass); border-radius: 99px; padding: 1px 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.chip.hot { background: var(--accent); color: #07162c; border-color: transparent; font-weight: 500; }
.chip.beta { color: var(--warn); border-color: rgba(255,217,138,.55); }
.chip.final { color: var(--good); border-color: rgba(141,255,193,.55); }
.lead { margin: 0 0 18px; color: rgba(236,243,255,.86); max-width: 60ch; font-weight: 300; font-size: 18px; }
.sub { margin: 22px 0 10px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.br { display: grid; grid-template-columns: 9em minmax(0, 1fr) 3.2em; gap: 12px; align-items: center; font-size: 15px; }
.br .tr { height: 6px; background: rgba(255,255,255,.14); border-radius: 9px; overflow: hidden; }
.br .fl { height: 100%; border-radius: 9px; background: linear-gradient(90deg, #7ec3ff, #c9e6ff); box-shadow: 0 0 12px rgba(159,208,255,.8); transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1); }
.br.hi .fl { background: linear-gradient(90deg, #66f0a6, #d3ffe6); box-shadow: 0 0 12px rgba(141,255,193,.8); }
.br .v { text-align: right; font-family: var(--mono); font-size: 14px; }
@keyframes grow { from { transform: scaleX(0); } }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { border: 1px solid var(--edge); background: var(--glass); border-radius: 99px; padding: 8px 22px; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-block; transition: background .2s, box-shadow .2s; }
.btn:hover { background: var(--glass-2); box-shadow: 0 0 20px rgba(159,208,255,.4); }
.btn.go { background: linear-gradient(180deg, #bfe1ff, #7bbcff); color: #06162c; font-weight: 500; border-color: transparent; }
.btn.go:hover { box-shadow: 0 0 26px rgba(159,208,255,.8); background: linear-gradient(180deg, #d4ebff, #98ccff); }
.btn.sm { padding: 2px 14px; font-size: 12px; }
.note { color: var(--dim); font-size: 14px; margin: 8px 0 0; }
.hash { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 15px; }
.hash code { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.hash code.ph { color: var(--dim); }
.cmdrow { display: flex; gap: 10px; align-items: flex-start; }
.cmd { flex: 1; min-width: 0; overflow-x: auto; white-space: pre; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 14px; font-family: var(--mono); font-size: 14px; color: var(--good); }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shot { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; line-height: 1.5; white-space: pre-line; min-height: 96px; }
.shot em { display: block; font-style: normal; font-family: var(--font); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.shot.after { border-color: rgba(141,255,193,.6); }
.shot.after em { color: var(--good); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 30px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.log li { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 10px; }
.log b { font-family: var(--mono); font-weight: 500; font-size: 14px; color: var(--warn); padding-top: 2px; }
.step { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; margin: 14px 0; }
.step i { font-style: normal; font-weight: 300; font-size: 34px; line-height: 1; color: var(--accent); }
.step h3 { margin: 0 0 2px; font-weight: 500; font-size: 19px; }
.step p { margin: 0; color: rgba(236,243,255,.82); font-weight: 300; font-size: 17px; max-width: 58ch; }
.warn { border: 1px solid rgba(255,217,138,.5); background: rgba(255,217,138,.08); border-radius: 16px; padding: 12px 16px; color: #ffe9b8; font-weight: 300; font-size: 17px; }
.warn b { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; display: block; color: var(--warn); }
.hint { margin-top: auto; padding-top: 26px; display: flex; gap: 18px; flex-wrap: wrap; color: var(--dim); font-size: 14px; letter-spacing: .08em; }
.hint kbd { font-family: var(--mono); border: 1px solid var(--edge); border-bottom-width: 3px; border-radius: 6px; padding: 0 7px; margin-right: 6px; color: var(--ink); }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .cats { gap: 30px; }
  .hint { display: none; }
}
@media (max-width: 480px) {
  .panel { padding: 20px 16px; border-radius: 22px; }
  .br { grid-template-columns: 7.4em minmax(0, 1fr) 3em; font-size: 14px; }
  .hash { grid-template-columns: 3.6em minmax(0, 1fr) auto; }
  .cmdrow { flex-direction: column; }
  .cmdrow .cmd { width: 100%; flex: none; }
  .clock .t { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .cats, .cat, .item, .item .ic, .panel, .br .fl { transition: none; animation: none; }
}

/* ---------- tambahan v2 ---------- */
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--edge); background: var(--glass); color: var(--ink); border-radius: 99px; padding: 3px 14px; cursor: pointer; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; display: inline-flex; gap: 8px; align-items: center; }
.chipbtn:hover { background: var(--glass-2); }
.chipbtn[aria-pressed="true"] { border-color: rgba(141,255,193,.7); color: var(--good); }
.chipbtn kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--edge); border-radius: 5px; padding: 0 5px; color: var(--dim); }
.sample { color: var(--warn); border-color: rgba(255,217,138,.55); }

.thumb { position: relative; display: block; width: 100%; border: 1px solid var(--edge); border-radius: 16px; overflow: hidden; cursor: pointer; padding: 0; background: #000; aspect-ratio: 16 / 9; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; transition: transform .5s, opacity .3s; }
.thumb:hover img { transform: scale(1.04); opacity: 1; }
.play { position: absolute; inset: 0; display: grid; place-items: center; }
.play span { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; box-shadow: 0 0 30px rgba(159,208,255,.6); }
.play svg { width: 26px; height: 26px; fill: #fff; margin-left: 4px; }
.thumb .cap { position: absolute; left: 12px; bottom: 10px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; background: rgba(0,0,0,.55); padding: 2px 10px; border-radius: 99px; }
.btn.ghost { background: transparent; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.credits { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 4px 12px; font-size: 15px; }
.credits dt { color: var(--dim); }
.credits dd { margin: 0; }
.compat { display: flex; flex-wrap: wrap; gap: 8px; }
.compat .chip.ok { color: var(--good); border-color: rgba(141,255,193,.55); }
.compat .chip.no { color: var(--dim); }

/* statistik dan umpan */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
.stat { border: 1px solid var(--edge); background: var(--glass); border-radius: 18px; padding: 12px 14px; }
.stat b { display: block; font-weight: 300; font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.feed { display: flex; flex-direction: column; gap: 8px; }
.fi { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--edge); background: var(--glass); border-radius: 16px; padding: 10px 14px; cursor: pointer; }
.fi:hover { background: var(--glass-2); }
.fi canvas { width: 40px; height: 40px; image-rendering: pixelated; justify-self: center; }
.fi img.cov { width: 48px; height: 48px; object-fit: cover; border-radius: 9px; justify-self: center; display: block; }
.ytlink { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--dim); }
.fi h3 { margin: 0; font-weight: 500; font-size: 18px; }
.fi p { margin: 0; color: var(--dim); font-size: 15px; }
.fi .v { font-family: var(--mono); font-size: 14px; color: var(--warn); }
.road { display: flex; flex-direction: column; gap: 8px; }
.rd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; border: 1px solid var(--edge); background: var(--glass); border-radius: 16px; padding: 10px 14px; }
.rd h3 { margin: 0; font-weight: 500; font-size: 18px; }
.rd .tr { grid-column: 1 / -1; height: 5px; background: rgba(255,255,255,.14); border-radius: 9px; overflow: hidden; }
.rd .fl { height: 100%; background: linear-gradient(90deg, #7ec3ff, #c9e6ff); border-radius: 9px; }

/* donasi */
.goal { border: 1px solid var(--edge); background: var(--glass); border-radius: 18px; padding: 14px 16px; margin: 6px 0 18px; }
.goal .tt { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.goal .tt b { font-weight: 500; font-family: var(--mono); font-size: 15px; }
.goal .tr { height: 10px; background: rgba(255,255,255,.14); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.goal .fl { height: 100%; background: linear-gradient(90deg, #ffd98a, #fff1cc); box-shadow: 0 0 14px rgba(255,217,138,.8); border-radius: 9px; animation: grow .9s cubic-bezier(.2,.8,.2,1); transform-origin: left; }
.pay { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pbtn { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); border: 1px solid var(--edge); border-radius: 20px; padding: 16px 18px; background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); transition: box-shadow .25s, transform .25s; }
.pbtn:hover { box-shadow: 0 0 28px rgba(159,208,255,.5); transform: translateY(-2px); }
.pbtn b { font-weight: 500; font-size: 22px; letter-spacing: .02em; }
.pbtn small { color: var(--dim); font-size: 14px; }
.pbtn i { font-style: normal; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--warn); }
.tabs { display: inline-flex; border: 1px solid var(--edge); border-radius: 99px; padding: 3px; background: var(--glass); gap: 2px; margin-bottom: 16px; }
.tabs button { border: 0; background: none; color: var(--dim); padding: 4px 16px; border-radius: 99px; cursor: pointer; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #07162c; font-weight: 500; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; margin: 6px 0 18px; }
.pod { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
.pod .nm { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.2; }
.pod .am { font-family: var(--mono); font-size: 14px; color: var(--warn); }
.pod .blk { width: 100%; border-radius: 14px 14px 0 0; border: 1px solid var(--edge); border-bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.04)); display: grid; place-items: start center; padding-top: 10px; }
.medal { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; color: #1a1205; font-size: 18px; box-shadow: 0 0 18px rgba(255,255,255,.35); }
.m1 { background: radial-gradient(circle at 35% 30%, #fff3c4, #f0b429); }
.m2 { background: radial-gradient(circle at 35% 30%, #ffffff, #aab6c8); }
.m3 { background: radial-gradient(circle at 35% 30%, #ffe0c2, #c98450); }
.lb { display: flex; flex-direction: column; gap: 6px; }
.lr { position: relative; display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 14px; overflow: hidden; }
.lr .bg { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(159,208,255,.28), rgba(159,208,255,.04)); z-index: 0; }
.lr > * { position: relative; z-index: 1; }
.lr .rk { font-family: var(--mono); color: var(--dim); }
.lr .nm { font-size: 17px; overflow-wrap: anywhere; line-height: 1.25; }
.lr .nm small { display: block; color: var(--dim); font-size: 13px; font-weight: 300; }
.lr .am { font-family: var(--mono); font-size: 15px; }
.tier { border: 1px solid var(--edge); background: var(--glass); border-radius: 18px; padding: 12px 16px; margin-bottom: 10px; }
.tier h3 { margin: 0; font-weight: 500; font-size: 19px; }
.tier .am { font-family: var(--mono); font-size: 14px; color: var(--warn); }
.tier ul { margin: 6px 0 0; padding-left: 18px; color: rgba(236,243,255,.82); font-size: 16px; }

/* dialog */
.ov { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(3,6,18,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade .25s; }
.ov[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.dlg { width: min(780px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 26px; border: 1px solid var(--edge); background: linear-gradient(160deg, rgba(40,52,96,.92), rgba(12,18,44,.94)); box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(159,208,255,.18); animation: rise .35s cubic-bezier(.2,.8,.2,1); }
.dh { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px 0; }
.dh h2 { margin: 0; font-weight: 300; font-size: 26px; text-wrap: balance; }
.x { border: 1px solid var(--edge); background: var(--glass); color: var(--ink); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none; }
.x:hover { background: var(--glass-2); }
.db { padding: 14px 22px 8px; }
.df { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 22px 20px; }
.dots { display: flex; gap: 8px; align-items: center; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.dots i { width: 28px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); }
.dots i.on { background: var(--accent); box-shadow: 0 0 10px rgba(159,208,255,.8); }
.vid { width: 100%; border-radius: 16px; background: #000; border: 1px solid var(--edge); display: block; aspect-ratio: 16 / 9; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12); cursor: pointer; font-size: 17px; }
.chk input { width: 20px; height: 20px; margin-top: 3px; accent-color: #9fd0ff; flex: none; }
.cta { margin-top: 18px; border: 1px dashed rgba(255,217,138,.6); border-radius: 18px; padding: 14px 16px; background: rgba(255,217,138,.06); }
.cta p { margin: 0 0 10px; font-weight: 300; font-size: 17px; }

  ci = c; ii = i;
  if (changed || !itemEls.length) buildItems();
  paint();
  if (!quiet) blip(changed ? 560 : 680, 0.07);
}
function goId(id) {
  for (var a = 0; a < CATS.length; a++) for (var b = 0; b < CATS[a].items.length; b++) if (CATS[a].items[b].id === id) { go(a, b); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
}

/* ===== pencarian ===== */
function openSearch() {
  var all = [];
  CATS.forEach(function (c, a) { c.items.forEach(function (it, b) { if (!it.empty) all.push({ a: a, b: b, name: it.name, cat: c.label, hay: (it.name + " " + c.label + " " + (it.text || "") + " " + it.sub).toLowerCase() }); }); });
  var sel = 0, cur = [];
  openModal("Cari", function (body) {
    var inp = document.createElement("input"); inp.className = "sin"; inp.type = "search"; inp.placeholder = "Nama game, konsol, atau menu"; inp.id = "q"; inp.setAttribute("aria-label", "Cari");
    var res = el("div", "res"); res.setAttribute("role", "listbox");
    body.appendChild(inp); body.appendChild(res);
    function draw() {
      var q = inp.value.trim().toLowerCase();
      cur = all.filter(function (x) { return !q || x.hay.indexOf(q) >= 0; }).slice(0, 30);
      sel = Math.min(sel, Math.max(0, cur.length - 1));
      res.textContent = "";
      if (!cur.length) { res.appendChild(el("p", "note", "Tidak ada hasil untuk “" + inp.value + "”.")); return; }
      cur.forEach(function (x, i) {
        var b = el("button", "rs" + (i === sel ? " on" : "")); b.type = "button"; b.setAttribute("role", "option");
        b.appendChild(el("span", null, x.name)); b.appendChild(el("small", null, x.cat));
        b.addEventListener("click", function () { closeModal(); go(x.a, x.b); });
        res.appendChild(b);
      });
    }
    inp.addEventListener("input", function () { sel = 0; draw(); });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(cur.length - 1, sel + 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      else if (e.key === "Enter" && cur[sel]) { e.preventDefault(); closeModal(); go(cur[sel].a, cur[sel].b); }
    });
    draw();
  }, function (e) { if (e.key === "Tab") trapTab(e); });
  var q = $("q"); if (q) q.focus();
}

/* ===== papan tombol, geser, dan pintasan ===== */
document.addEventListener("keydown", function (e) {
  if (modal.open) { if (e.key === "Escape") { e.preventDefault(); closeModal(); } else if (modal.onKey) modal.onKey(e); return; }
  var t = e.target || {};
  if (/INPUT|TEXTAREA|SELECT/.test(t.tagName || "")) return;
  if (e.key === "/") { e.preventDefault(); openSearch(); return; }
  var n;
  if (e.key === "ArrowRight") n = [Math.min(CATS.length - 1, ci + 1), 0];
  else if (e.key === "ArrowLeft") n = [Math.max(0, ci - 1), 0];
  else if (e.key === "ArrowDown") n = [ci, Math.min(CATS[ci].items.length - 1, ii + 1)];
  else if (e.key === "ArrowUp") n = [ci, Math.max(0, ii - 1)];
  else return;
  e.preventDefault(); go(n[0], n[1]);
});
var tx0 = 0, ty0 = 0, tok = false;
$("app").addEventListener("touchstart", function (e) {
  var t = e.touches[0]; tx0 = t.clientX; ty0 = t.clientY;
  tok = !e.target.closest(".cmd,video,.vid,.podium");
}, { passive: true });
$("app").addEventListener("touchend", function (e) {
  if (!tok || modal.open) return;
  var t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) go(Math.max(0, Math.min(CATS.length - 1, ci + (dx < 0 ? 1 : -1))), 0);
}, { passive: true });
addEventListener("resize", layoutCats);

/* ===== tombol bilah atas ===== */
$("bSearch").addEventListener("click", openSearch);
function setSound(on) { soundOn = on; var b = $("bSound"); b.setAttribute("aria-pressed", String(on)); b.textContent = "Suara: " + (on ? "nyala" : "mati"); store("snd", on ? "1" : "0"); }
$("bSound").addEventListener("click", function () { setSound(!soundOn); blip(990, 0.12, 1480); });
if (store("snd") === "1") soundOn = false; /* butuh interaksi dulu agar audio boleh jalan */
var COLORS = [["otomatis", null], ["biru", 215], ["ungu", 270], ["hijau", 150], ["merah", 350], ["emas", 40]];
var colorIdx = 0, hue = 0;
var HUES = [215, 195, 160, 128, 95, 52, 30, 8, 338, 300, 268, 238];
function applyColor() {
  var c = COLORS[colorIdx]; hue = c[1] == null ? HUES[new Date().getMonth()] : c[1];
  var r = document.documentElement.style;
  r.setProperty("--top", "hsl(" + hue + " 72% 30%)"); r.setProperty("--bot", "hsl(" + ((hue + 18) % 360) + " 80% 8%)");
  $("bColor").textContent = "Warna: " + c[0]; store("clr", String(colorIdx));
}
var sc0 = parseInt(store("clr") || "0", 10); colorIdx = isNaN(sc0) || sc0 < 0 || sc0 >= COLORS.length ? 0 : sc0; applyColor();
$("bColor").addEventListener("click", function () { colorIdx = (colorIdx + 1) % COLORS.length; applyColor(); blip(820, 0.1, 1100); });
if (!SAMPLE) $("sampleTag").hidden = true;

/* ===== jam ===== */
var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
function tick() {
  var d = new Date();
  $("time").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  $("date").textContent = d.getDate() + " " + BULAN[d.getMonth()];
  $("mon").textContent = "WIB";
}
tick(); setInterval(tick, 20000);

/* ===== latar gelombang sutra (waktu nyata) ===== */
var cv = $("wave"), cx = cv.getContext("2d"), cw = 0, ch = 0, dpr = 1;
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fit() { dpr = Math.min(2, devicePixelRatio || 1); cw = innerWidth; ch = innerHeight; cv.width = cw * dpr; cv.height = ch * dpr; if (reduce) draw(0); }
function wy(x, k, t, base, amp, f, sp) { return base + Math.sin(x * f + t * sp * 6 + k * 1.7) * amp + Math.sin(x * f * 2.1 - t * sp * 4 + k) * amp * 0.35; }
function draw(t) {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, cw, ch);
  for (var k = 0; k < 4; k++) {
    var base = ch * (0.52 + k * 0.07), amp = 26 + k * 12, f = 0.0042 - k * 0.0006, sp = 0.00022 + k * 0.00008;
    var g = cx.createLinearGradient(0, base - amp, 0, ch);
    g.addColorStop(0, "hsla(" + hue + ",90%,80%," + (0.16 - k * 0.025) + ")"); g.addColorStop(1, "hsla(" + hue + ",90%,60%,0)");
    cx.beginPath(); cx.moveTo(0, ch);
    for (var x = 0; x <= cw; x += 8) cx.lineTo(x, wy(x, k, t, base, amp, f, sp));
    cx.lineTo(cw, ch); cx.closePath(); cx.fillStyle = g; cx.fill();
    cx.beginPath();
    for (var x2 = 0; x2 <= cw; x2 += 8) { var y2 = wy(x2, k, t, base, amp, f, sp); if (x2 === 0) cx.moveTo(x2, y2); else cx.lineTo(x2, y2); }
    cx.strokeStyle = "rgba(255,255,255," + (0.28 - k * 0.05) + ")"; cx.lineWidth = 1.2; cx.stroke();
  }
}
function loop(t) { if (!document.hidden) draw(t); requestAnimationFrame(loop); }
addEventListener("resize", fit);
fit(); if (!reduce) requestAnimationFrame(loop);

/* ===== mulai ===== */
buildCats();
var hh = (location.hash || "").slice(1), sc = 0, si = 0;
CATS.forEach(function (c, a) { c.items.forEach(function (it, b) { if (it.id === hh) { sc = a; si = b; } }); });
ci = sc; ii = si; buildItems(); paint();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutCats);

});
